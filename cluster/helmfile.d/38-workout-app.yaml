releases:
  - name: workout-app
    namespace: workout-app
    chart:  oci://gitea.b-rad.dev/brad/helm-charts/workout-app
    version: 1.0.0
    values:
      - service:
          port: 8080
      - serviceAccount:
          create: true
      - ingress:
          enabled: true
          className: nginx
          annotations:
            cert-manager.io/cluster-issuer: "letsencrypt-production"
          hosts:
            - host: workout.b-rad.dev
              paths:
                - path: /
                  pathType: ImplementationSpecific
          tls:
            - hosts:
                - workout.b-rad.dev
      - env:
          - name: THEME_URL
            value: https://b-rad.dev/theme/1.3.0/theme.min.css
          - name: THEME_JS_URL
            value: https://b-rad.dev/theme/1.3.0/theme.min.js